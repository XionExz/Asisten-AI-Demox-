
< !-- DEMOX AI -- >

<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Demox AI Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #090b12;
      color: #f5f7ff;
    }
    .app { max-width: 850px; margin: auto; min-height: 100vh; }
    header {
      padding: 18px; border-bottom: 1px solid #252a3b;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; background: #090b12;
    }
    .logo {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 14px; background: linear-gradient(135deg,#7c3aed,#06b6d4);
      font-weight: 900; font-size: 19px;
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { font-size: 12px; margin: 4px 0 0; color: #9ba6c5; }
    #chat { padding: 22px 16px 145px; }
    .welcome { text-align: center; padding: 50px 8px 28px; }
    .welcome h2 { font-size: 29px; margin-bottom: 10px; }
    .welcome p { color: #9ba6c5; line-height: 1.6; }
    .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .suggestion {
      text-align: left; padding: 14px; color: #e5e9ff;
      background: #121625; border: 1px solid #293049;
      border-radius: 13px; cursor: pointer;
    }
    .message {
      white-space: pre-wrap; line-height: 1.7; margin: 18px 0;
      padding: 14px 16px; border-radius: 15px; overflow-wrap: anywhere;
    }
    .user { background: #242044; margin-left: 12%; }
    .assistant { background: #121625; border: 1px solid #252b40; margin-right: 5%; }
    .label { font-size: 11px; color: #9ba6c5; margin-bottom: 6px; }
    .composer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent,#090b12 20%);
      padding: 22px 14px max(18px, env(safe-area-inset-bottom));
    }
    .composer-inner { max-width: 820px; margin: auto; }
    .inputbox {
      display: flex; align-items: end; gap: 8px; padding: 9px;
      border: 1px solid #343b55; border-radius: 18px; background: #151928;
    }
    textarea {
      flex: 1; resize: none; border: 0; outline: 0; color: white;
      background: transparent; padding: 10px; font: inherit;
      max-height: 140px; min-width: 0;
    }
    #send {
      border: 0; border-radius: 12px; padding: 12px 15px;
      background: #7c3aed; color: white; font-weight: bold; cursor: pointer;
    }
    #send:disabled { opacity: .5; }
    .note { text-align: center; color: #747f9e; font-size: 11px; margin: 9px 0 0; }
    @media(max-width:420px) {
      .welcome h2 { font-size: 25px; }
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">D</div>
    <div><h1>Demox AI</h1><p>AI Assistant · Chat interface</p></div>
  </header>  <main id="chat">
    <section class="welcome" id="welcome">
      <div class="logo" style="margin:auto;width:60px;height:60px;font-size:26px">D</div>
      <h2>Selamat datang di Demox AI</h2>
      <p>Asisten AI untuk membantu ide, coding, belajar, dan berbagai pertanyaanmu.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Bantu aku belajar coding dari nol">💻 Belajar coding</button>
        <button class="suggestion" data-prompt="Buatkan ide website keren">🌐 Ide website</button>
        <button class="suggestion" data-prompt="Jelaskan kecerdasan buatan dengan mudah">🧠 Mengenal AI</button>
        <button class="suggestion" data-prompt="Bantu aku mencari ide proyek teknologi">⚡ Ide proyek</button>
      </div>
    </section>
    <div id="messages"></div>
  </main>  <div class="composer">
    <div class="composer-inner">
      <div class="inputbox">
        <textarea id="prompt" rows="1" placeholder="Tanyakan sesuatu kepada Demox AI..."></textarea>
        <button id="send">Kirim ↑</button>
      </div>
      <p class="note" id="status">Demox AI · Siap membantu</p>
    </div>
  </div>
</div>
<script>
  const input = document.getElementById('prompt');
  const send = document.getElementById('send');
  const messages = document.getElementById('messages');
  const welcome = document.getElementById('welcome');function addMessage(role, text) {
const box = document.createElement('div');
box.className = 'message ' + role;
const label = document.createElement('div');
label.className = 'label';
label.textContent = role === 'user' ? 'Kamu' : 'Demox AI';
const content = document.createElement('div');
content.textContent = text;
box.append(label, content);
messages.appendChild(box);
window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
return content;
}

async function submitPrompt(text) {
text = (text || input.value).trim();
if (!text || send.disabled) return;
welcome.style.display = 'none';
input.value = '';
input.style.height = 'auto';
addMessage('user', text);
send.disabled = true;
document.getElementById('status').textContent = 'Demox AI sedang berpikir...';
const answer = addMessage('assistant', 'Menghubungkan ke backend AI...');

try {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: text})
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Permintaan gagal.');
  answer.textContent = data.reply || 'AI belum memberikan jawaban.';
} catch (error) {
  answer.textContent = 'Backend AI belum aktif atau terjadi kesalahan: ' + error.message +
    '\n\nTampilan sudah dibuat. Backend dan konfigurasi API perlu disiapkan pada langkah berikutnya.';
} finally {
  send.disabled = false;
  document.getElementById('status').textContent = 'Demox AI · Siap membantu';
  input.focus();
}

}

send.addEventListener('click', () => submitPrompt());
input.addEventListener('keydown', e => {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
submitPrompt();
}
});
input.addEventListener('input', () => {
input.style.height = 'auto';
input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
document.querySelectorAll('[data-prompt]').forEach(button => {
button.addEventListener('click', () => submitPrompt(button.dataset.prompt));
});
</script>

</body>
  </html>
